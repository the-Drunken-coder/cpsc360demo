[project]
name = "cpsc360"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "scikit-learn>=1.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cpsc360"]

[tool.setuptools.package-data]
cpsc360 = ["schema.sql"]
